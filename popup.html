<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Friday — Dev Popup</title>
    <style>
      html, body { margin: 0; padding: 0; }
      body {
        width: 360px;
        font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #111;
        background: #fff;
        padding: 14px 14px 16px;
      }
      h1 { font-size: 15px; margin: 0 0 10px; }
      .row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
      button {
        font: inherit;
        padding: 6px 12px;
        border: 1px solid #d0d0d5;
        background: #f7f7f8;
        border-radius: 6px;
        cursor: pointer;
      }
      button:hover { background: #eeeef1; }
      #status {
        font-size: 12px;
        color: #555;
        min-height: 16px;
      }
      progress {
        width: 100%;
        height: 8px;
        display: none;
      }
      progress.visible { display: block; }
      #output {
        margin-top: 10px;
        padding: 8px;
        background: #f7f7f8;
        border: 1px solid #e5e5ea;
        border-radius: 6px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
        white-space: pre-wrap;
        min-height: 40px;
        max-height: 220px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <h1>Friday — Dev Popup (Phase 0)</h1>

    <div class="row">
      <button id="testAiBtn" type="button">Test AI</button>
      <button id="runSampleBtn" type="button" disabled>Run on sample</button>
      <label style="font-size:12px; color:#333;">
        <input id="forceWasm" type="checkbox" /> Force WASM
      </label>
    </div>
    <div class="row">
      <button id="pingBgBtn" type="button">Ping BG</button>
      <button id="readSettingsBtn" type="button">Read settings</button>
      <button id="pingContentBtn" type="button">Ping content</button>
      <button id="captureBtn" type="button">Capture</button>
      <button id="facesBtn" type="button">Detect faces</button>
      <button id="ocrBtn" type="button">Run OCR</button>
      <button id="redactBtn" type="button">Redact</button>
      <span id="status">idle</span>
    </div>

    <img id="captureImg" alt="last capture" style="display:none; width:100%; margin-top:8px; border:1px solid #e5e5ea; border-radius:6px;" />

    <progress id="progress" value="0" max="100"></progress>

    <div id="output" aria-live="polite">(output will appear here)</div>

    <script type="module" src="src/popup-main.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Friday</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <!-- Stylised crimson wing / spark mark. Replaceable later. -->
          <svg viewBox="0 0 24 24" width="22" height="22">
            <path fill="#ff2e63" d="M12 2 L14.5 9.5 L22 12 L14.5 14.5 L12 22 L9.5 14.5 L2 12 L9.5 9.5 Z"/>
          </svg>
        </span>
        <span class="brand-name">Friday</span>
      </div>

      <div class="mode-pill" id="modePill" role="button" tabindex="0" aria-label="Mode">
        <span id="modeLabel">Chat</span>
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
          <path fill="currentColor" d="M7 10l5 5 5-5z"/>
        </svg>
      </div>

      <div class="header-right">
        <button
          class="mode-toggle"
          id="deviceToggle"
          type="button"
          aria-label="Cloud or On-Device"
          data-on-device="true"
        >
          <span class="mode-toggle-track">
            <span class="mode-toggle-icon mode-toggle-icon--cloud" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="14" height="14">
                <path fill="currentColor" d="M19.35 10.04A7.49 7.49 0 0 0 12 4a7.5 7.5 0 0 0-6.98 4.79A5.5 5.5 0 0 0 6.5 20h12a4.5 4.5 0 0 0 .85-8.96z"/>
              </svg>
            </span>
            <span class="mode-toggle-icon mode-toggle-icon--device" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="14" height="14">
                <path fill="currentColor" d="M4 5h16v10H4zM2 17h20v2H2zm7 3h6v1H9z"/>
              </svg>
            </span>
            <span class="mode-toggle-thumb"></span>
          </span>
        </button>

        <button class="icon-btn" id="settingsBtn" type="button" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="currentColor" d="M19.14 12.94a7.6 7.6 0 0 0 0-1.88l2.03-1.58a.5.5 0 0 0 .12-.63l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.4 7.4 0 0 0-1.63-.95l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54a7.4 7.4 0 0 0-1.63.95l-2.39-.96a.5.5 0 0 0-.6.22L2.65 8.85a.5.5 0 0 0 .12.63l2.03 1.58a7.6 7.6 0 0 0 0 1.88L2.77 14.52a.5.5 0 0 0-.12.63l1.92 3.32a.5.5 0 0 0 .6.22l2.39-.96a7.4 7.4 0 0 0 1.63.95l.36 2.54a.5.5 0 0 0 .5.42h3.84a.5.5 0 0 0 .5-.42l.36-2.54a7.4 7.4 0 0 0 1.63-.95l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.63zM12 15.5A3.5 3.5 0 1 1 15.5 12 3.5 3.5 0 0 1 12 15.5z"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="app-body">
      <section class="empty-state" id="emptyState">
        <span class="spark" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="52" height="52">
            <path fill="#ff2e63" d="M24 3 L28 20 L45 24 L28 28 L24 45 L20 28 L3 24 L20 20 Z"/>
            <circle cx="9" cy="9" r="2.2" fill="#ff2e63"/>
            <circle cx="39" cy="10" r="1.6" fill="#ff2e63"/>
            <circle cx="41" cy="39" r="2" fill="#ff2e63"/>
          </svg>
        </span>
        <h1 class="hero">Hey! I'm <span class="accent">Friday</span></h1>
        <p class="subtitle">
          Your private AI agent, running on your device.<br />
          No data leaves your browser.
        </p>
      </section>
    </main>

    <footer class="app-input">
      <form class="composer" id="composer" autocomplete="off">
        <input
          class="composer-input"
          id="composerInput"
          type="text"
          placeholder="Hey!, Wassup what you doing now."
          aria-label="Message Friday"
        />
        <div class="composer-row">
          <button class="composer-icon-btn" id="plusBtn" type="button" aria-label="Add">
            <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
          </button>

          <div class="composer-model-pill" id="modelPill" role="button" tabindex="0" aria-label="Select model">
            <span id="modelLabel">Select Model</span>
            <svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path fill="currentColor" d="M7 10l5 5 5-5z"/></svg>
          </div>

          <div class="composer-spacer"></div>

          <button class="composer-icon-btn" id="micBtn" type="button" aria-label="Voice input">
            <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11z"/></svg>
          </button>

          <button class="composer-send" id="sendBtn" type="submit" aria-label="Send">
            <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M4 12l16-8-6 16-2.5-6.5z"/></svg>
          </button>
        </div>
      </form>
    </footer>

    <script type="module" src="src/sidepanel-main.js"></script>
  </body>
</html>

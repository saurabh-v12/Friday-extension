<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Synthetic UI screenshot used by task 0.6 to exercise the VLM.
       Deliberately simple: a title, two labelled inputs (email + password),
       a primary button, a secondary link. Rendered in the browser via
       createImageBitmap → OffscreenCanvas → RawImage. -->
  <defs>
    <style>
      .card { fill:#ffffff; stroke:#e5e5ea; stroke-width:1; }
      .title { font: 700 22px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill:#111; }
      .label { font: 500 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill:#333; }
      .input { fill:#f7f7f8; stroke:#d0d0d5; stroke-width:1; }
      .placeholder { font: 400 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill:#8a8a90; }
      .btn { fill:#111; }
      .btn-text { font: 600 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill:#fff; }
      .link { font: 500 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill:#ff2e63; }
      .bg { fill:#f2f2f5; }
    </style>
  </defs>

  <rect class="bg" width="512" height="512"/>

  <!-- Card -->
  <rect class="card" x="56" y="76" width="400" height="360" rx="14" ry="14"/>

  <!-- Title -->
  <text class="title" x="96" y="132">Sign in to Acme</text>

  <!-- Email field -->
  <text class="label" x="96" y="180">Email</text>
  <rect class="input" x="96" y="192" width="320" height="42" rx="8" ry="8"/>
  <text class="placeholder" x="112" y="219">you@example.com</text>

  <!-- Password field -->
  <text class="label" x="96" y="262">Password</text>
  <rect class="input" x="96" y="274" width="320" height="42" rx="8" ry="8"/>
  <text class="placeholder" x="112" y="301">••••••••</text>

  <!-- Sign in button -->
  <rect class="btn" x="96" y="342" width="320" height="46" rx="10" ry="10"/>
  <text class="btn-text" x="234" y="371">Sign in</text>

  <!-- Forgot password link -->
  <text class="link" x="256" y="416" text-anchor="middle">Forgot password?</text>
</svg>
